<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t d">
  <title id="t">A simple remote work desk</title>
  <desc id="d">A desk with a laptop on the left, one external monitor in the middle showing code, a keyboard and mouse in front of it, and a paper notebook with a pen at the front left.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d6c4c"/>
      <stop offset="1" stop-color="#6c5038"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101830"/>
      <stop offset="1" stop-color="#182345"/>
    </linearGradient>
  </defs>

  <!-- wall + desk -->
  <rect width="800" height="450" fill="url(#wall)"/>
  <rect y="318" width="800" height="132" fill="url(#desk)"/>
  <rect y="318" width="800" height="5" fill="#ab8764"/>

  <!-- monitor -->
  <ellipse cx="460" cy="326" rx="90" ry="6" fill="#000" opacity=".25"/>
  <rect x="440" y="272" width="40" height="46" fill="#2b3350"/>
  <rect x="388" y="312" width="144" height="9" rx="4" fill="#3a4570"/>
  <rect x="250" y="70" width="420" height="210" rx="10" fill="#1d243a" stroke="#3a4670" stroke-width="2"/>
  <rect x="262" y="82" width="396" height="182" rx="4" fill="url(#glow)"/>
  <circle cx="276" cy="94" r="3.5" fill="#ff6b6b"/>
  <circle cx="288" cy="94" r="3.5" fill="#ffd166"/>
  <circle cx="300" cy="94" r="3.5" fill="#4ee0c1"/>
  <g stroke-linecap="round" stroke-width="7">
    <line x1="280" y1="120" x2="340" y2="120" stroke="#b07cff"/>
    <line x1="348" y1="120" x2="430" y2="120" stroke="#6ea8ff"/>
    <line x1="296" y1="138" x2="380" y2="138" stroke="#4ee0c1"/>
    <line x1="388" y1="138" x2="440" y2="138" stroke="#94a0b8"/>
    <line x1="296" y1="156" x2="350" y2="156" stroke="#6ea8ff"/>
    <line x1="358" y1="156" x2="470" y2="156" stroke="#94a0b8"/>
    <line x1="312" y1="174" x2="420" y2="174" stroke="#ff7ad9"/>
    <line x1="296" y1="192" x2="396" y2="192" stroke="#4ee0c1"/>
    <line x1="404" y1="192" x2="450" y2="192" stroke="#6ea8ff"/>
    <line x1="280" y1="210" x2="330" y2="210" stroke="#b07cff"/>
    <line x1="338" y1="210" x2="400" y2="210" stroke="#94a0b8"/>
    <line x1="280" y1="228" x2="360" y2="228" stroke="#6ea8ff"/>
  </g>

  <!-- laptop -->
  <rect x="60" y="196" width="160" height="108" rx="7" fill="#c6cee0"/>
  <rect x="67" y="203" width="146" height="94" rx="3" fill="#101728"/>
  <rect x="76" y="212" width="70" height="10" rx="5" fill="#b07cff"/>
  <rect x="76" y="228" width="104" height="10" rx="5" fill="#2a3556"/>
  <rect x="104" y="244" width="90" height="10" rx="5" fill="#4ee0c1"/>
  <rect x="76" y="260" width="58" height="10" rx="5" fill="#2a3556"/>
  <rect x="122" y="276" width="76" height="10" rx="5" fill="#6ea8ff"/>
  <rect x="44" y="304" width="192" height="14" rx="5" fill="#a9b3cb"/>
  <rect x="118" y="304" width="44" height="4" rx="2" fill="#8993ad"/>

  <!-- keyboard -->
  <rect x="330" y="350" width="262" height="48" rx="7" fill="#2a3150"/>
  <g stroke="#4c587f" stroke-width="7" stroke-dasharray="15 3.5" stroke-linecap="butt">
    <line x1="340" y1="361" x2="582" y2="361"/>
    <line x1="340" y1="370" x2="582" y2="370"/>
    <line x1="340" y1="379" x2="582" y2="379"/>
  </g>
  <rect x="392" y="386" width="140" height="7" rx="3" fill="#4c587f"/>

  <!-- mouse -->
  <rect x="624" y="354" width="28" height="42" rx="14" fill="#3a4570"/>
  <line x1="624" y1="371" x2="652" y2="371" stroke="#242c48" stroke-width="2"/>
  <line x1="638" y1="360" x2="638" y2="371" stroke="#242c48" stroke-width="2"/>

  <!-- notebook + pen -->
  <g transform="rotate(-5 155 395)">
    <rect x="76" y="346" width="156" height="98" rx="4" fill="#00000033" transform="translate(4 5)"/>
    <rect x="76" y="346" width="156" height="98" rx="4" fill="#f1e7cf"/>
    <rect x="76" y="346" width="12" height="98" rx="3" fill="#6ea8ff"/>
    <g stroke="#c9bd9f" stroke-width="1.5">
      <line x1="100" y1="368" x2="220" y2="368"/>
      <line x1="100" y1="384" x2="220" y2="384"/>
      <line x1="100" y1="400" x2="220" y2="400"/>
      <line x1="100" y1="416" x2="220" y2="416"/>
      <line x1="100" y1="432" x2="220" y2="432"/>
    </g>
    <g fill="none" stroke="#3b4a78" stroke-width="2" stroke-linecap="round">
      <rect x="101" y="354" width="8" height="8" rx="1.5"/>
      <path d="M103 358 l2 2.5 l4 -6"/>
      <line x1="116" y1="360" x2="190" y2="360"/>
      <rect x="101" y="372" width="8" height="8" rx="1.5"/>
      <line x1="116" y1="377" x2="178" y2="377"/>
      <rect x="101" y="388" width="8" height="8" rx="1.5"/>
      <line x1="116" y1="393" x2="200" y2="393"/>
    </g>
  </g>
  <g transform="rotate(-12 282 410)">
    <rect x="246" y="407" width="72" height="6" rx="3" fill="#6ea8ff"/>
    <rect x="246" y="407" width="12" height="6" rx="3" fill="#2a3556"/>
  </g>
</svg>
