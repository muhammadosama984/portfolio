<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Osama's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <div class="container nav-container">
        <div class="logo">Osama</div>
        <ul class="navbar">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </nav>
    <main class="container contact-section">
      <h1>Contact Me</h1>
      <form class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <button type="submit">Send</button>
      </form>
      <div class="contact-info">
        <p>Email: <a href="mailto:osama@email.com">osama@email.com</a></p>
        <p>
          LinkedIn:
          <a href="https://linkedin.com/in/your-linkedin" target="_blank"
            >your-linkedin</a
          >
        </p>
      </div>
    </main>
    <footer>
      <div class="container">&copy; 2024 Osama. All rights reserved.</div>
    </footer>
  </body>
</html>
